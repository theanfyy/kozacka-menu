<title>Kozacka Chatka</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yeseva+One&family=PT+Sans:wght@400;700&display=swap');

  :root {

    --ink: #241810;
    --ink-muted: #6E5E49;
    --line: #D8CBAC;
    --red: #A63328;
    --blue: #33507A;
    --gold: #A87B12;
    --veg: #4C7A4A;
    --focus: #33507A;
    --warn: #8A4B12;
    --dish-hue: 8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B140D;
      --bg-2: #241A10;
      --surface: #2A1E14;
      --ink: #F2E9D8;
      --ink-muted: #B9A98B;
      --line: #40311F;
      --red: #E2604F;
      --blue: #86A6DA;
      --gold: #E0B33C;
      --veg: #8FBB7A;
      --focus: #86A6DA;
      --warn: #E0A868;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B140D;
    --bg-2: #241A10;
    --surface: #2A1E14;
    --ink: #F2E9D8;
    --ink-muted: #B9A98B;
    --line: #40311F;
    --red: #E2604F;
    --blue: #86A6DA;
    --gold: #E0B33C;
    --veg: #8FBB7A;
    --focus: #86A6DA;
    --warn: #E0A868;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'PT Sans', -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
  }

  .dish-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s ease;
    background: radial-gradient(ellipse 70% 50% at 50% 20%, hsl(var(--dish-hue) 55% 45% / .30), transparent 65%);
  }
  .dish-backdrop.active { opacity: 1; }

  .page { position: relative; z-index: 2; }

  .ribbon { display: flex; height: 12px; }
  .ribbon span { display: block; }
  .ribbon span:nth-child(1) { flex: 3; background: var(--red); }
  .ribbon span:nth-child(2) { flex: 1; background: var(--gold); }
  .ribbon span:nth-child(3) { flex: 2; background: var(--blue); }
  .ribbon span:nth-child(4) { flex: 1; background: var(--gold); }
  .ribbon span:nth-child(5) { flex: 3; background: var(--red); }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }

  header.hero {
    position: relative;
    overflow: hidden;
    background: var(--bg-2);
    padding: 30px 0 24px;
    border-bottom: 1px solid var(--line);
  }
  header.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 90% at 12% 15%, color-mix(in srgb, var(--red) 30%, transparent), transparent 60%),
      radial-gradient(ellipse 55% 80% at 88% 25%, color-mix(in srgb, var(--blue) 26%, transparent), transparent 60%),
      radial-gradient(ellipse 75% 60% at 50% 105%, color-mix(in srgb, var(--gold) 22%, transparent), transparent 65%),
      repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink) 5%, transparent) 0 2px, transparent 2px 16px),
      linear-gradient(color-mix(in srgb, var(--bg-2) 58%, transparent), color-mix(in srgb, var(--bg-2) 88%, transparent)),
      var(--hero-photo, none);
    background-size: auto, auto, auto, auto, cover, cover;
    background-position: 0 0, 0 0, 0 0, 0 0, center, center;
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
    pointer-events: none;
  }
  header.hero .wrap { position: relative; z-index: 1; }
  h1.name {
    font-family: 'Yeseva One', Georgia, serif;
    font-weight: 400;
    font-size: clamp(2.1rem, 7vw, 2.9rem);
    margin: 0 0 4px;
    text-wrap: balance;
    color: var(--ink);
  }
  p.subtitle {
    margin: 0 0 14px;
    color: var(--ink-muted);
    font-size: 0.98rem;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 0.82rem;
    color: var(--ink-muted);
  }
  .meta-row span { white-space: nowrap; }

  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 12px 0 10px;
  }
  .controls-row1 {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .search-field {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
  }
  .search-field svg { flex: none; color: var(--ink-muted); }
  .search-field input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.95rem;
    min-width: 0;
  }
  .search-field input::placeholder { color: var(--ink-muted); }

  .lang-group {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    flex: none;
  }
  .lang-group button {
    appearance: none;
    border: none;
    background: var(--surface);
    color: var(--ink-muted);
    font: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 8px 9px;
    cursor: pointer;
    border-left: 1px solid var(--line);
  }
  .lang-group button:first-child { border-left: none; }
  .lang-group button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
  }
  .lang-group button:focus-visible,
  .search-field input:focus-visible,
  .chip:focus-visible,
  .veg-toggle:focus-visible,
  .allergy-field input:focus-visible,
  li.dish:focus-visible,
  .modal-close:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .controls-row2 {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .chips-wrap { position: relative; flex: 1; min-width: 0; }
  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--red) transparent;
  }
  .chips::-webkit-scrollbar { height: 7px; }
  .chips::-webkit-scrollbar-track { background: transparent; }
  .chips::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .chips::-webkit-scrollbar-thumb:hover { background: var(--red); }
  .chips-wrap::before,
  .chips-wrap::after {
    content: "";
    position: absolute;
    top: 0; bottom: 8px;
    width: 22px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
    z-index: 1;
  }
  .chips-wrap::before {
    left: 0;
    background: linear-gradient(to right, var(--bg), transparent);
  }
  .chips-wrap::after {
    right: 0;
    background: linear-gradient(to left, var(--bg), transparent);
  }
  .chips-wrap.can-scroll-left::before { opacity: 1; }
  .chips-wrap.can-scroll-right::after { opacity: 1; }
  .chip {
    appearance: none;
    flex: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 0.82rem;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .veg-toggle {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 0.78rem;
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .veg-toggle .leaf {
    width: 10px; height: 10px;
    background: var(--veg);
    border-radius: 0 70% 0 70%;
    transform: rotate(45deg);
    flex: none;
  }
  .veg-toggle[aria-pressed="true"] {
    background: var(--veg);
    border-color: var(--veg);
    color: #fff;
  }
  .veg-toggle[aria-pressed="true"] .leaf { background: #fff; }

  .controls-row3 { margin-top: 10px; }
  .allergy-field {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 10px;
  }
  .allergy-field svg { flex: none; color: var(--warn); }
  .allergy-field input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 0.9rem;
    min-width: 0;
  }
  .allergy-field input::placeholder { color: var(--ink-muted); }
  .allergy-note {
    margin: 6px 2px 0;
    font-size: 0.72rem;
    color: var(--warn);
  }

  main { padding: 10px 0 8px; }

  section.category {
    padding: 26px 0 6px;
    scroll-margin-top: 150px;
  }
  section.category + section.category {
    border-top: 1px solid var(--line);
  }
  .cat-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  h2.cat-title {
    font-family: 'Yeseva One', Georgia, serif;
    font-weight: 400;
    font-size: 1.3rem;
    margin: 0;
    color: var(--red);
  }
  .cat-count {
    font-size: 0.76rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  ul.dishes { list-style: none; margin: 0; padding: 0; }
  li.dish {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 6px;
    margin: 0 -6px;
    border-bottom: 1px dotted var(--line);
    cursor: pointer;
    border-radius: 4px;
  }
  li.dish:last-child { border-bottom: none; }
  li.dish:hover, li.dish:focus-visible {
    background: color-mix(in srgb, var(--red) 6%, transparent);
  }
  .dish-thumb {
    flex: none;
    width: 52px; height: 52px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--bg-2);
  }
  .dish-main { flex: 1; min-width: 0; }
  .dish-name-row {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .dish-name { font-weight: 700; font-size: 0.98rem; }
  .leaf-mark {
    width: 8px; height: 8px;
    background: var(--veg);
    border-radius: 0 70% 0 70%;
    transform: rotate(45deg);
    flex: none;
  }
  .dish-desc {
    color: var(--ink-muted);
    font-size: 0.84rem;
    margin-top: 3px;
  }
  .dish-weight {
    color: var(--ink-muted);
    font-size: 0.76rem;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .dish-price {
    flex: none;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 1rem;
    color: var(--ink);
    padding-top: 1px;
  }

  .empty-state {
    padding: 40px 0;
    text-align: center;
    color: var(--ink-muted);
    font-size: 0.92rem;
  }

  footer {
    position: relative;
    background: var(--bg-2);
    border-top: 1px solid var(--line);
    padding: 22px 0 26px;
    margin-top: 18px;
  }
  footer p {
    margin: 0 0 6px;
    font-size: 0.8rem;
    color: var(--ink-muted);
  }
  footer .brand {
    font-family: 'Yeseva One', Georgia, serif;
    color: var(--ink);
    font-size: 1rem;
    margin-bottom: 8px;
  }
  footer details {
    margin-top: 10px;
    font-size: 0.74rem;
    color: var(--ink-muted);
  }
  footer summary {
    cursor: pointer;
    color: var(--ink-muted);
  }
  footer .credits-list {
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
    columns: 2;
    column-gap: 18px;
    font-size: 0.7rem;
    line-height: 1.6;
  }
  @media (max-width: 480px) { footer .credits-list { columns: 1; } }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--ink) 45%, transparent);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: var(--surface);
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 14px 14px 0 0;
    padding: 0 0 24px;
    transform: translateY(24px);
    transition: transform .3s ease;
    position: relative;
  }
  .modal-overlay.open .modal-card { transform: translateY(0); }
  @media (min-width: 640px) {
    .modal-overlay { align-items: center; }
    .modal-card { border-radius: 14px; max-height: 84vh; }
  }
  .modal-visual {
    position: relative;
    height: 190px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    color: #fff;
    background: linear-gradient(155deg, hsl(var(--dish-hue) 48% 42%), hsl(var(--dish-hue) 58% 28%));
    background-size: cover;
    background-position: center;
    border-radius: 14px 14px 0 0;
    overflow: hidden;
  }
  .modal-visual::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, color-mix(in srgb, hsl(var(--dish-hue) 55% 20%) 78%, transparent), transparent 55%);
  }
  .modal-icon-badge {
    position: relative;
    z-index: 1;
    width: 44px; height: 44px;
    margin: 14px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--ink) 45%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-icon-badge svg { width: 24px; height: 24px; opacity: .95; }
  .modal-close {
    position: absolute;
    top: 10px; right: 10px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: color-mix(in srgb, var(--ink) 55%, transparent);
    color: #fff;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-body { padding: 20px 22px 0; }
  h3.modal-name {
    font-family: 'Yeseva One', Georgia, serif;
    font-weight: 400;
    font-size: 1.5rem;
    margin: 0 0 6px;
    color: var(--ink);
    text-wrap: balance;
  }
  .modal-price-row {
    display: flex;
    gap: 14px;
    align-items: baseline;
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }
  .modal-price { font-weight: 700; font-size: 1.15rem; color: var(--red); }
  .modal-weight { color: var(--ink-muted); font-size: 0.85rem; }
  .modal-desc {
    font-size: 0.98rem;
    margin: 0 0 18px;
    color: var(--ink);
  }
  .modal-section { margin-bottom: 16px; }
  .modal-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin-bottom: 5px;
  }
  .modal-comp { margin: 0; font-size: 0.9rem; color: var(--ink); }
  .modal-allergens { display: flex; flex-wrap: wrap; gap: 6px; }
  .allergen-chip {
    font-size: 0.76rem;
    padding: 4px 9px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--warn) 16%, var(--surface));
    color: var(--warn);
    border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  }

  @media (min-width: 720px) {
    li.dish { padding: 13px 6px; }
  }
</style>

<script>
(function () {

    { title: "File:Traditional houses in Tokari, Sumy Oblast, Ukraine.jpg", license: "CC BY 4.0" },
  ];
  var creditsListEl = document.getElementById('creditsList');
  CREDITS.forEach(function (c) {
    var li = document.createElement('li');
    li.textContent = c.title.replace(/^File:/, '') + ' — ' + c.license;
    creditsListEl.appendChild(li);
  });

  var state = { lang: "pl", cat: "all", q: "", vegOnly: false, allergyTokens: [] };

  var $chips = document.getElementById("chips");
  var $chipsWrap = document.getElementById("chipsWrap");
  var $menu = document.getElementById("menu");
  var $empty = document.getElementById("emptyState");
  var $search = document.getElementById("search");
  var $vegToggle = document.getElementById("vegToggle");
  var $allergyInput = document.getElementById("allergyInput");
  var $backdrop = document.getElementById("dishBackdrop");
  var $modalOverlay = document.getElementById("modalOverlay");
  var $modalClose = document.getElementById("modalClose");
  var $modalVisual = document.getElementById("modalVisual");
  var $modalName = document.getElementById("modalName");
  var $modalPrice = document.getElementById("modalPrice");
  var $modalWeight = document.getElementById("modalWeight");
  var $modalDesc = document.getElementById("modalDesc");
  var $modalCompLabel = document.getElementById("modalCompLabel");
  var $modalComp = document.getElementById("modalComp");
  var $modalAllergLabel = document.getElementById("modalAllergLabel");
  var $modalAllergens = document.getElementById("modalAllergens");

  function buildChips() {
    $chips.innerHTML = "";
    var allChip = document.createElement("button");
    allChip.className = "chip";
    allChip.dataset.cat = "all";
    allChip.setAttribute("aria-pressed", state.cat === "all" ? "true" : "false");
    $chips.appendChild(allChip);
    CATS.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "chip";
      b.dataset.cat = c.key;
      b.setAttribute("aria-pressed", state.cat === c.key ? "true" : "false");
      $chips.appendChild(b);
    });
    $chips.querySelectorAll(".chip").forEach(function (b) {
      b.addEventListener("click", function () {
        state.cat = b.dataset.cat;
        render();
        if (state.cat !== "all") {
          var target = document.getElementById("cat-" + state.cat);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    });
    updateChipFades();
  }

  function updateChipFades() {
    var maxScroll = $chips.scrollWidth - $chips.clientWidth;
    $chipsWrap.classList.toggle("can-scroll-left", $chips.scrollLeft > 4);
    $chipsWrap.classList.toggle("can-scroll-right", $chips.scrollLeft < maxScroll - 4);
  }
  $chips.addEventListener("scroll", updateChipFades);
  window.addEventListener("resize", updateChipFades);
  $chips.addEventListener("wheel", function (e) {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      $chips.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });

  function parseAllergyInput(raw) {
    var tokens = raw.toLowerCase().split(/[,;]+/).map(function (t) { return t.trim(); }).filter(Boolean);
    var matched = [];
    tokens.forEach(function (tok) {
      Object.keys(ALLERGEN_SYNONYMS).forEach(function (code) {
        ALLERGEN_SYNONYMS[code].forEach(function (syn) {
          if (tok.length >= 3 && (syn.indexOf(tok) !== -1 || tok.indexOf(syn) !== -1)) {
            if (matched.indexOf(code) === -1) matched.push(code);
          }
        });
      });
    });
    return matched;
  }

  function matches(item) {
    if (state.vegOnly && !item.veg) return false;
    if (state.cat !== "all" && item.cat !== state.cat) return false;
    if (state.allergyTokens.length) {
      for (var i = 0; i < item.allergens.length; i++) {
        if (state.allergyTokens.indexOf(item.allergens[i]) !== -1) return false;
      }
    }
    if (state.q) {
      var q = state.q.toLowerCase();
      var hay = (item.name + " " + item.desc[state.lang]).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function openModal(item) {
    var s = STR[state.lang];
    var hue = hueFor(item.name);
    document.documentElement.style.setProperty("--dish-hue", hue);
    if (item.img) {
      $modalVisual.style.backgroundImage = "url(" + item.img + ")";
    } else {
      $modalVisual.style.backgroundImage = "";
    }
    $modalVisual.innerHTML = '<span class="modal-icon-badge">' + (ICONS[item.cat] || "") + '</span>';
    $modalName.textContent = item.name;
    $modalPrice.textContent = item.price + " zł";
    $modalWeight.textContent = item.w;
    $modalDesc.textContent = item.desc[state.lang];
    $modalCompLabel.textContent = s.compositionLabel;
    $modalComp.textContent = item.comp[state.lang];
    $modalAllergLabel.textContent = s.allergensLabel;
    $modalAllergens.innerHTML = "";
    if (item.allergens.length) {
      item.allergens.forEach(function (code) {
        var chip = document.createElement("span");
        chip.className = "allergen-chip";
        chip.textContent = ALLERGEN_LABEL[code][state.lang];
        $modalAllergens.appendChild(chip);
      });
    } else {
      var chip = document.createElement("span");
      chip.className = "allergen-chip";
      chip.textContent = s.noAllergens;
      $modalAllergens.appendChild(chip);
    }
    $modalOverlay.classList.add("open");
    $backdrop.classList.add("active");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    $modalOverlay.classList.remove("open");
    $backdrop.classList.remove("active");
    document.body.style.overflow = "";
  }
  $modalClose.addEventListener("click", closeModal);
  $modalOverlay.addEventListener("click", function (e) {
    if (e.target === $modalOverlay) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });

  function render() {
    var s = STR[state.lang];
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      el.textContent = s[el.getAttribute("data-t")];
    });
    document.querySelectorAll("[data-t-placeholder]").forEach(function (el) {
      el.setAttribute("placeholder", s[el.getAttribute("data-t-placeholder")]);
    });
    $chips.querySelectorAll(".chip").forEach(function (b) {
      var key = b.dataset.cat;
      b.textContent = key === "all" ? s.all : (CATS.filter(function (c) { return c.key === key; })[0] || {})[state.lang];
      b.setAttribute("aria-pressed", state.cat === key ? "true" : "false");
    });
    document.querySelectorAll(".lang-group button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.lang === state.lang ? "true" : "false");
    });
    $vegToggle.setAttribute("aria-pressed", state.vegOnly ? "true" : "false");

    $menu.innerHTML = "";
    var anyVisible = false;
    CATS.forEach(function (c) {
      var items = DISHES.filter(function (it) { return it.cat === c.key && matches(it); });
      if (state.cat !== "all" && state.cat !== c.key) return;
      if (!items.length) return;
      anyVisible = true;

      var section = document.createElement("section");
      section.className = "category";
      section.id = "cat-" + c.key;

      var head = document.createElement("div");
      head.className = "cat-head";
      var h2 = document.createElement("h2");
      h2.className = "cat-title";
      h2.textContent = c[state.lang];
      var count = document.createElement("span");
      count.className = "cat-count";
      count.textContent = items.length;
      head.appendChild(h2);
      head.appendChild(count);
      section.appendChild(head);

      var ul = document.createElement("ul");
      ul.className = "dishes";
      items.forEach(function (it) {
        var li = document.createElement("li");
        li.className = "dish";
        li.tabIndex = 0;
        li.setAttribute("role", "button");

        if (it.img) {
          var thumb = document.createElement("img");
          thumb.className = "dish-thumb";
          thumb.src = it.img;
          thumb.alt = "";
          thumb.loading = "lazy";
          li.appendChild(thumb);
        }

        var main = document.createElement("div");
        main.className = "dish-main";

        var nameRow = document.createElement("div");
        nameRow.className = "dish-name-row";
        var nameEl = document.createElement("span");
        nameEl.className = "dish-name";
        nameEl.textContent = it.name;
        nameRow.appendChild(nameEl);
        if (it.veg) {
          var leaf = document.createElement("span");
          leaf.className = "leaf-mark";
          leaf.title = s.vegOnly;
          nameRow.appendChild(leaf);
        }
        main.appendChild(nameRow);

        var desc = document.createElement("div");
        desc.className = "dish-desc";
        desc.textContent = it.desc[state.lang];
        main.appendChild(desc);

        var weight = document.createElement("div");
        weight.className = "dish-weight";
        weight.textContent = it.w;
        main.appendChild(weight);

        var price = document.createElement("div");
        price.className = "dish-price";
        price.textContent = it.price + " zł";

        li.appendChild(main);
        li.appendChild(price);
        li.addEventListener("click", function () { openModal(it); });
        li.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(it); }
        });
        ul.appendChild(li);
      });
      section.appendChild(ul);
      $menu.appendChild(section);
    });

    $empty.hidden = anyVisible;
    updateChipFades();
  }

  buildChips();

  $search.addEventListener("input", function () {
    state.q = $search.value.trim();
    render();
  });
  $vegToggle.addEventListener("click", function () {
    state.vegOnly = !state.vegOnly;
    render();
  });
  $allergyInput.addEventListener("input", function () {
    state.allergyTokens = parseAllergyInput($allergyInput.value);
    render();
  });
  document.querySelectorAll(".lang-group button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.lang = b.dataset.lang;
      render();
    });
  });

  render();
})();
</script>
